<nav class="bottom-nav">
  @for (item of items; track item.path) {
    <a class="bottom-nav__item" [routerLink]="item.path" routerLinkActive="bottom-nav__item--active">
      <span class="bottom-nav__icon"><app-icon [name]="item.icon" [size]="22" /></span>
      <span>{{ item.label }}</span>
    </a>
  }
  <button class="bottom-nav__item" type="button" (click)="more.emit()">
    <span class="bottom-nav__icon">
      <app-icon name="more" [size]="22" />
      @if (unread() > 0) { <i class="bottom-nav__dot"></i> }
    </span>
    <span>More</span>
  </button>
</nav>
