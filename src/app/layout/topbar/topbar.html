<header class="top">
  <label class="top__search">
    <app-icon name="search" [size]="18" />
    <input type="search" placeholder="Search groups, members, auctions…" [(ngModel)]="query" (keydown.enter)="search()" />
  </label>

  <div class="top__actions">
    <button class="top__btn" type="button" (click)="theme.toggle()" [attr.aria-label]="theme.isDark() ? 'Light mode' : 'Dark mode'">
      <app-icon [name]="theme.isDark() ? 'sun' : 'moon'" [size]="19" />
    </button>
    <a class="top__btn" routerLink="/notifications" aria-label="Notifications">
      <app-icon name="bell" [size]="19" />
      @if (unread() > 0) { <i class="top__badge">{{ unread() }}</i> }
    </a>
    <a class="top__user" routerLink="/profile">
      <span class="top__avatar">{{ user().initials }}</span>
      <b>{{ user().name }}</b>
      <app-icon name="chevdown" [size]="16" />
    </a>
  </div>
</header>
