<a class="card gc" routerLink="/groups/details" [queryParams]="{ id: group().id }" [style.--accent]="group().color">
  <div class="gc__top">
    <app-icon-tile [icon]="group().icon" [bg]="group().bg" [color]="group().color" [size]="50" />
    <div class="gc__title">
      <div class="gc__name">
        <b>{{ group().name }}</b>
        @if (isToday()) { <span class="pill pill--live">Auction today</span> }
        @else { <span class="gc__tag">{{ group().duration }} months</span> }
      </div>
      <span class="gc__label">Chit value</span>
      <b class="gc__amount">₹{{ group().value | inr }}</b>
    </div>
    <app-progress-ring [value]="percent()" [size]="58" [thickness]="6" />
  </div>

  <div class="gc__stats">
    <div>
      <span>Monthly</span>
      <b>₹{{ group().monthly | inr }}</b>
    </div>
    <div>
      <span>Paid</span>
      <b>{{ group().paid }}/{{ group().members }}</b>
    </div>
    <div>
      <span>Next auction</span>
      <b>{{ group().nextAuction | date: 'dd MMM' }}</b>
    </div>
  </div>

  <div class="gc__foot">
    <span class="gc__when"><app-icon name="gavel" [size]="13" /> {{ when() }}</span>
    <span class="gc__go">View details <app-icon name="arrow" [size]="14" [stroke]="2.4" /></span>
  </div>
</a>
