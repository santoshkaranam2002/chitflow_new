<div class="ring" [class.ring--light]="light()" [style.width.px]="size()" [style.height.px]="size()">
  <svg [attr.width]="size()" [attr.height]="size()" [attr.viewBox]="'0 0 ' + size() + ' ' + size()">
    <defs>
      <linearGradient [attr.id]="gradientId" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff4d1c" />
        <stop offset="1" stop-color="#ffb067" />
      </linearGradient>
    </defs>
    <circle class="ring__track" [attr.cx]="size() / 2" [attr.cy]="size() / 2" [attr.r]="radius()" [attr.stroke-width]="thickness()" fill="none" />
    <circle class="ring__bar" [attr.cx]="size() / 2" [attr.cy]="size() / 2" [attr.r]="radius()" [attr.stroke-width]="thickness()" fill="none"
      [attr.stroke]="light() ? '#fff' : 'url(#' + gradientId + ')'" stroke-linecap="round"
      [attr.stroke-dasharray]="circumference()" [attr.stroke-dashoffset]="offset()" />
  </svg>
  <span class="ring__label">{{ label() || (value() | number: '1.0-0') + '%' }}</span>
</div>
