<app-page-header title="Members">
  <button class="icon-btn" type="button" (click)="toggleSearch()" aria-label="Search"><app-icon [name]="searching() ? 'close' : 'search'" [size]="20" /></button>
  <button class="icon-btn" type="button" [class.icon-btn--primary]="filtering()" (click)="filtering.set(!filtering())" aria-label="Filter"><app-icon name="filter" [size]="20" /></button>
  <a class="icon-btn icon-btn--primary" routerLink="/members/add" aria-label="Add member"><app-icon name="plus" [size]="22" /></a>
</app-page-header>

<div class="members-reveal" [class.members-reveal--open]="searching()">
  <div class="input-group"><app-icon name="search" [size]="18" /><input placeholder="Search by name or member no…" [(ngModel)]="query" /></div>
</div>
<div class="members-reveal" [class.members-reveal--open]="filtering()">
  <div class="chips members-filter">
    @for (f of filters; track f.id) {
      <button class="chip" type="button" [class.chip--active]="status() === f.id" (click)="status.set(f.id)">{{ f.label }}</button>
    }
  </div>
</div>

<app-tabs [options]="tabs()" [(value)]="tab" />

<div class="members-summary">
  <span><i class="dot dot--ok"></i>{{ paidCount() }} paid</span>
  <span><i class="dot dot--pd"></i>{{ pendingCount() }} pending</span>
</div>

@for (m of visible(); track m.id; let i = $index) {
  <app-member-item class="reveal" [style.--i]="i" [member]="m" />
} @empty {
  <app-empty-state icon="user" title="No members found" text="Adjust your filters or add a new member." />
}
