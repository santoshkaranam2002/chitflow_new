<app-page-header title="Change Password" subtitle="Keep your account secure">
  <button class="icon-btn" type="button" (click)="visible.set(!visible())" aria-label="Toggle visibility"><app-icon [name]="visible() ? 'eyeoff' : 'eye'" [size]="20" /></button>
</app-page-header>

<div class="cp__shield"><app-icon name="shield" [size]="30" /></div>

<label class="label">Current password</label>
<div class="input-group"><app-icon name="lock" [size]="18" /><input [type]="visible() ? 'text' : 'password'" [(ngModel)]="current" autocomplete="current-password" /></div>

<label class="label">New password</label>
<div class="input-group"><app-icon name="lock" [size]="18" /><input [type]="visible() ? 'text' : 'password'" [(ngModel)]="next" autocomplete="new-password" /></div>

<div class="cp__strength" [attr.data-score]="strength().score">
  <div class="cp__meter">@for (s of segments; track s) { <i [class.on]="strength().score >= s"></i> }</div>
  <span>{{ strength().label || 'Strength' }}</span>
</div>
<ul class="cp__checks">
  @for (c of strength().checks; track c.label) {
    <li [class.ok]="c.ok"><span><app-icon name="check" [size]="11" [stroke]="3.4" /></span>{{ c.label }}</li>
  }
</ul>

<label class="label">Confirm password</label>
<div class="input-group" [class.cp__group--ok]="matches()">
  <app-icon name="lock" [size]="18" />
  <input [type]="visible() ? 'text' : 'password'" [(ngModel)]="confirm" autocomplete="new-password" />
  @if (matches()) { <span class="cp__match"><app-icon name="check" [size]="16" [stroke]="3" /></span> }
</div>

<div class="spacer"></div>
<button class="btn" type="button" (click)="update()">Update Password</button>
